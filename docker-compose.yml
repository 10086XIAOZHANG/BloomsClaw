# 本地开发：从源码构建，端口映射到宿主机方便 curl / 日志调试
services:
  blooms-claw-sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: blooms-claw-sandbox:dev
    container_name: blooms-claw-sandbox-dev
    restart: "no"
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      PORT: "8080"
      MAX_OUTPUT_BYTES: "100000"
      COMMAND_TIMEOUT_MS: "120000"
    networks:
      - blooms-claw-sandbox

networks:
  blooms-claw-sandbox:
    name: blooms-claw-sandbox
    driver: bridge
